name: Continuous Integration - Pengyn Studio

# O pipeline roda a cada push ou pull request na branch develop
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  backend-validation:
    runs-on: ubuntu-latest

    steps:
    # 1. Faz o checkout do seu código no container do GitHub
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Configura a versão correta do Python
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # 3. Cria um cache para o pip acelerar os próximos deploys
    - name: Cache Python Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # 4. Instala as dependências listadas no seu requirements.txt
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
        pip install flake8  # Instala o linter para checagem de sintaxe

    # 5. Validação de Linting: Varre o código atrás de erros de sintaxe ou imports quebrados
    - name: Lint with Flake8
      run: |
        # para o build se houver erros de sintaxe Python ou undefined names
        flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # avisos de estilo saem como warning sem quebrar a esteira
        flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics